services:
  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
      target: dev
    container_name: aftermath-backend
    command: sh -c "npm ci && npm run migrate && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app:Z
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://aftermath:aftermath@postgres:5432/aftermath
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aftermath-net

  postgres:
    image: postgres:16-alpine
    container_name: aftermath-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aftermath
      POSTGRES_PASSWORD: aftermath
      POSTGRES_DB: aftermath
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aftermath -d aftermath"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aftermath-net

networks:
  aftermath-net:
    driver: bridge

volumes:
  pgdata:
