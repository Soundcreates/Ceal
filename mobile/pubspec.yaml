name: aftermath
description: "Offline-first BLE emergency alert mesh network for civic safety."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # BLE
  flutter_blue_plus: ^1.32.0
  flutter_ble_peripheral: ^2.1.0

  # Permissions
  permission_handler: ^11.3.1

  # Location
  geolocator: ^13.0.2

  # Local storage
  sqflite: ^2.4.1
  path: ^1.9.1

  # Networking
  http: ^1.2.2

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Background tasks
  flutter_foreground_task: ^8.13.3

  # Environment variables (.env file)
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
